services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Withdev2026}
    volumes:
      - dados-sqlserver:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SENHA: ${DB_PASSWORD:-Withdev2026}
    entrypoint:
      - /bin/bash
      - -c
      - |
        SQL="/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P $$SENHA -C -b"
        $$SQL -Q "IF DB_ID('withdev_orcamentos') IS NULL CREATE DATABASE withdev_orcamentos" || exit 1
        for i in $$(seq 1 60); do
          $$SQL -d withdev_orcamentos -Q "SELECT 1" -o /dev/null && echo "banco pronto" && exit 0
          sleep 2
        done
        echo "banco nao ficou pronto" && exit 1

  app:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-Withdev2026}
    ports:
      - "8080:8080"

volumes:
  dados-sqlserver:
